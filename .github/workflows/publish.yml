name: Publish to npm

# Runs when a version tag is pushed (v1.0.0). The package is published with npm Trusted Publishing (OIDC):
# npmjs.com -> matterbridge-ambientika -> Settings -> Trusted Publisher:
#   GitHub Actions, ambientika-eu / matterbridge-ambientika, workflow publish.yml
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm (Trusted Publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Install matterbridge
        run: npm install -g matterbridge --omit=dev

      - name: Install plugin dependencies
        run: npm ci --no-fund --no-audit

      - name: Link matterbridge in the plugin
        run: npm link matterbridge --no-fund --no-audit

      - name: Check that the tag is the version of the package
        if: github.event_name == 'push'
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Check if this version is on npm already
        id: check
        run: |
          if npm view "matterbridge-ambientika@$(node -p "require('./package.json').version")" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (the package is built by prepublishOnly)
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public
